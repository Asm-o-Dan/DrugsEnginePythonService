services:
  embedding_service:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/app/model
    env_file:
      - .env
    environment:
      - MODEL_PATH=/app/model
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      - qdrant
    restart: unless-stopped
    networks:
      - shared_services_default

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - shared_services_default  

networks:
  shared_services_default:
    external: true
    
volumes:
  qdrant_data: 
  huggingface_cache:  