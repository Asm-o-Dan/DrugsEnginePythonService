services:
  embedding_service:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/app/model  # только если не копируешь в образ
    environment:
      - MODEL_PATH=/app/model
    restart: unless-stopped

  
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://qdrant:6333/readyz" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - shared_services_default  

networks:
  shared_services_default:
    external: true
    
volumes:
  qdrant_data: 
  huggingface_cache:  